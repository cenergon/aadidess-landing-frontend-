<div class="tsej-banner">
  <div class="tsej-banner__container">
    <!-- Logo: se muestra uno u otro según el tema vía CSS -->
    <img
      src="images/logos/the-ski-education-journal-logo-negro.jpg"
      alt="The Ski Education Journal"
      class="tsej-banner__logo tsej-banner__logo--light"
      loading="lazy"
    />
    <img
      src="images/logos/the-ski-education-journal-logo-blanco.jpg"
      alt="The Ski Education Journal"
      class="tsej-banner__logo tsej-banner__logo--dark"
      loading="lazy"
    />

    <!-- Textos -->
    <div class="tsej-banner__content">
      <h2 class="tsej-banner__title">The Ski Education Journal</h2>
      <p class="tsej-banner__subtitle">
        A site where probing skiers find more than common skiing answers
      </p>
    </div>

    <!-- Botón -->
    <a
      [href]="siteUrl"
      class="tsej-banner__button"
      target="_blank"
      rel="noopener noreferrer"
    >
      Ir al sitio web
    </a>
  </div>
</div>
