<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AADIDESS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">


  <!-- Favicons (SVG principal, ICO fallback) -->
  <link rel="icon" type="image/svg+xml" href="svgs/AADIDESS-A-sola.svg">
  <link rel="icon" type="image/x-icon" href="AADIDESS-A-sola.ico">

  <!-- Google Fonts: Rubik ; Robot -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Google Material Symbols (íconos) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Prevenir FOUC/FOIT para Dark Mode -->
  <script>
    (function () {
      var stored = localStorage.getItem('aadidess-theme');
      // Default: light. Se respeta 'dark' o 'system'; 'system' sigue la preferencia del SO.
      var theme = stored === 'dark' || stored === 'system' ? stored : 'light';
      if (theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
